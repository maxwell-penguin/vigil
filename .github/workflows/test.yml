name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install sqlite3 dependencies
        run: sudo apt-get install -y gcc libsqlite3-dev

      - name: Run tests
        run: go test ./...
        env:
          CGO_ENABLED: 1

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: 1
